<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godesia - Arbre Genealògic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Tree styles now in style.css -->
</head>
<body>
    <div class="tree-app">
        <header>
            <h1>Godesia</h1>
            <nav>
                <a href="/" class="nav-link">Chat</a>
                <a href="/tree.html" class="nav-link active">Arbre</a>
            </nav>
        </header>

        <div class="tree-controls">
            <div class="search-wrapper">
                <input type="text" id="tree-search" placeholder="Cerca una persona..." autocomplete="off">
                <div class="search-results" id="search-results"></div>
            </div>
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="zoomOut()">-</button>
                <button class="zoom-btn" onclick="resetZoom()">R</button>
            </div>
        </div>

        <div class="tree-container" id="tree-container">
            <svg id="tree-svg"></svg>
            <div class="tree-info" id="tree-info">Cerca una persona per veure el seu arbre</div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="tree.js"></script>
</body>
</html>
