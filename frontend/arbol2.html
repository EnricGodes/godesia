<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godesia — Árbol 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={corePlugins:{preflight:false}}</script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/family-chart/dist/styles/family-chart.css">
  <script src="https://unpkg.com/family-chart/dist/family-chart.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    #FamilyChart { background: #1a2b20; }
    #FamilyChart svg { width: 100%; height: 100%; }

    #a2-search {
      width: 220px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 0.875rem;
      font-family: Manrope, sans-serif;
      outline: none;
    }
    #a2-search::placeholder { color: rgba(255,255,255,0.5); }
    #a2-search:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.18); }

    #a2-results {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 280px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      max-height: 300px;
      overflow-y: auto;
      z-index: 300;
    }
    .a2-result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 0.875rem;
      border-bottom: 1px solid #f3f0ea;
      color: #1c1c17;
      gap: 8px;
    }
    .a2-result-item:last-child { border-bottom: none; }
    .a2-result-item:hover { background: #f1eee5; }
    .a2-result-item small { color: #9e9b94; font-size: 0.75rem; white-space: nowrap; }

    .a2-zoom-btn {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-family: Manrope, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .a2-zoom-btn:hover { background: rgba(255,255,255,0.28); }

    #a2-sidebar {
      font-family: Manrope, sans-serif;
    }
    .a2-field { margin-bottom: 12px; }
    .a2-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: #9e9b94;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .a2-value { font-size: 0.875rem; color: #1c1c17; }
  </style>
</head>
<body>
  <div class="tree-app" style="position:relative;display:flex;flex-direction:column;overflow:hidden;">

    <!-- Barra de controles -->
    <div style="position:absolute;top:10px;left:10px;z-index:100;display:flex;gap:8px;align-items:center;">
      <div style="position:relative;">
        <input type="text" id="a2-search" placeholder="Cercar una persona..." autocomplete="off">
        <div id="a2-results"></div>
      </div>
      <button onclick="a2ZoomIn()"    class="a2-zoom-btn" title="Ampliar">+</button>
      <button onclick="a2ZoomOut()"   class="a2-zoom-btn" title="Reduir">−</button>
      <button onclick="a2ZoomReset()" class="a2-zoom-btn" title="Centrar">R</button>
    </div>

    <!-- Contenedor del árbol -->
    <div id="FamilyChart" class="f3" style="flex:1;width:100%;"></div>

    <!-- Panel lateral -->
    <div id="a2-sidebar" style="
      display:none;
      position:absolute;top:0;right:0;
      width:300px;height:100%;
      background:#fcf9f0;
      border-left:1px solid #d9d5cc;
      box-shadow:-4px 0 24px rgba(0,0,0,.14);
      z-index:150;
      overflow-y:auto;">
    </div>

  </div>

  <script src="/nav.js"></script>
  <script src="arbol2.js"></script>
</body>
</html>
