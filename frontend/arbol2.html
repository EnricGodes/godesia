<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godesia — Árbol 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={corePlugins:{preflight:false}}</script>
  <script src="/d3.v7.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/family-chart/dist/styles/family-chart.css">
  <script src="/family-chart.js"></script>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ── Color overrides: light background + design system grays (issue 1, 9) ── */
    #FamilyChart {
      background: #fcf9f0;   /* --surface */
      color: #1c1c17;        /* --on-surface */
      --male-color:        #c8c5bc;  /* warm gray dark  (men) */
      --female-color:      #e4e1d8;  /* warm gray light (women) */
      --genderless-color:  #d5d2c9;
      --background-color:  #fcf9f0;
      --text-color:        #1c1c17;
    }
    #FamilyChart svg { width: 100%; height: 100%; }
    /* Ensure text in SVG cards uses dark color */
    #FamilyChart svg text { fill: #1c1c17; }
    /* Relationship lines: dark on light background */
    #FamilyChart .links_view path { stroke: #8a8780; }

    /* ── Search bar ── */
    #a2-search {
      width: 220px;
      padding: 6px 12px;
      border: 1px solid #c2c8bf;
      border-radius: 8px;
      background: #ffffff;
      color: #1c1c17;
      font-size: 0.875rem;
      font-family: Manrope, sans-serif;
      outline: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    #a2-search::placeholder { color: #9e9b94; }
    #a2-search:focus { border-color: #2d4b33; box-shadow: 0 0 0 2px rgba(45,75,51,.15); }

    #a2-results {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 280px;
      background: #fff;
      border: 1px solid #c2c8bf;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 300px;
      overflow-y: auto;
      z-index: 300;
    }
    .a2-result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 0.875rem;
      border-bottom: 1px solid #f1eee5;
      color: #1c1c17;
      gap: 8px;
    }
    .a2-result-item:last-child { border-bottom: none; }
    .a2-result-item:hover { background: #f6f3ea; }
    .a2-result-item small { color: #9e9b94; font-size: 0.75rem; white-space: nowrap; }

    /* ── Zoom buttons ── */
    .a2-zoom-btn {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border: 1px solid #c2c8bf;
      border-radius: 6px;
      color: #424842;
      font-size: 1rem;
      cursor: pointer;
      font-family: Manrope, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .a2-zoom-btn:hover { background: #f1eee5; border-color: #2d4b33; }

    /* ── Mini-tree indicator ──
       The library renders <div class="mini-tree"> inside the card foreignObject,
       containing an <svg> sized 66×112px (positioned absolute, top:0 left:0)
       with viewBox 0 0 72 125 and inline style attributes. We override its
       size via CSS so the icon renders compact and sits above the card top. */
    #FamilyChart .mini-tree line { stroke: #8a8780; }
    #FamilyChart .mini-tree rect:not([fill="rgba(0,0,0,0)"]) { fill: #8a8780; }
    #FamilyChart div.mini-tree {
      position: absolute !important;
      top: -22px !important;
      left: 12px !important;
      right: auto !important;
      width: 38px !important;
      height: 22px !important;
      margin-left: 0 !important;
      transform: none !important;
      z-index: 0 !important;
      text-align: left !important;
      pointer-events: auto;
    }
    #FamilyChart div.mini-tree svg {
      width: 38px !important;
      height: 22px !important;
      position: static !important;
      display: block;
    }

    /* ── Sidebar ── (geometría en CSS para poder redefinirla en móvil sin !important;
       arbol2.js solo togglea display:block/none) */
    #a2-sidebar {
      display: none;
      position: absolute; top: 0; right: 0;
      width: 300px; height: 100%;
      background: #fcf9f0;
      border-left: 1px solid #d9d5cc;
      box-shadow: -4px 0 24px rgba(0,0,0,.14);
      z-index: 150;
      overflow-y: auto;
      font-family: Manrope, sans-serif;
    }
    .a2-field { margin-bottom: 12px; }
    .a2-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: #9e9b94;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .a2-value { font-size: 0.875rem; color: #1c1c17; }

    /* ── Móvil ── */
    @media (max-width: 767px) {
      #a2-toolbar { left: 8px; right: 8px; top: 8px; flex-wrap: wrap; }
      #a2-toolbar > div:first-child { flex: 1; min-width: 120px; }
      #a2-search { width: 100%; box-sizing: border-box; }
      #a2-results { left: 0; min-width: 0; width: calc(100vw - 16px); max-width: 340px; }
      /* Panel de persona como hoja inferior */
      #a2-sidebar {
        top: auto; bottom: 0; left: 0; right: 0;
        width: 100%; height: auto; max-height: 60vh;
        border-left: none; border-top: 1px solid #d9d5cc;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -4px 24px rgba(0,0,0,.16);
      }
    }
  </style>
</head>
<body>
  <div class="tree-app" style="position:relative;display:flex;flex-direction:column;overflow:hidden;">

    <!-- Barra de controles -->
    <div id="a2-toolbar" style="position:absolute;top:10px;left:10px;z-index:100;display:flex;gap:8px;align-items:center;">
      <div style="position:relative;">
        <input type="text" id="a2-search" placeholder="Buscar una persona..." data-i18n-placeholder="pages.tree.search_placeholder" autocomplete="off">
        <div id="a2-results"></div>
      </div>
      <button onclick="a2ZoomIn()"    class="a2-zoom-btn" title="Ampliar" data-i18n-title="pages.tree.zoom_in">+</button>
      <button onclick="a2ZoomOut()"   class="a2-zoom-btn" title="Reducir" data-i18n-title="pages.tree.zoom_out">−</button>
      <button onclick="a2ZoomReset()" class="a2-zoom-btn" title="Centrar" data-i18n-title="pages.tree.zoom_reset" style="display:flex;align-items:center;justify-content:center;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.13432 2.5C6.46805 2.56075 4.9107 2.81456 3.84664 3.87493C2.91537 4.80297 2.60406 6.10756 2.5 8.2M14.8657 2.5C17.532 2.56075 19.0893 2.81456 20.1534 3.87493C21.0846 4.80297 21.3959 6.10756 21.5 8.2M14.8657 21.5C17.532 21.4392 19.0893 21.1854 20.1534 20.1251C21.0846 19.197 21.3959 17.8924 21.5 15.8M9.13432 21.5C6.46805 21.4392 4.9107 21.1854 3.84664 20.1251C2.91537 19.197 2.60406 17.8924 2.5 15.8"></path><path d="M16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12Z"></path></svg></button>
    </div>

    <!-- Contenedor del árbol -->
    <div id="FamilyChart" class="f3" style="flex:1;width:100%;"></div>

    <!-- Panel lateral (geometría en el <style>; arbol2.js togglea display) -->
    <div id="a2-sidebar"></div>

  </div>

  <script src="/nav.js"></script>
  <script src="/arbol2.js?v=20260513"></script>
</body>
</html>
