<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Geocodificador Admin | Familia Godes</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#2D4B33",
                        "on-primary": "#ffffff",
                        "surface": "#fcf9f0",
                        "outline": "#727971",
                        "on-surface": "#1c1c17",
                    },
                    fontFamily: { body: ["Manrope"] }
                }
            }
        }
    </script>
    <style>
        body { font-family: Manrope, sans-serif; background: #fcf9f0; }
        #preview-map { height: 220px; border-radius: 8px; }
        .row-just-resolved { opacity: 0.45; }
    </style>
</head>
<body class="text-on-surface">

<div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-3xl font-extrabold text-primary">Geocodificador</h1>
            <p class="text-sm text-outline mt-1">Gestión de direcciones y coordenadas</p>
        </div>
        <div id="stats" class="text-right text-sm text-outline"></div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-1 mb-6 border-b border-outline/20">
        <button id="tab-pending" onclick="setTab('pending')"
            class="px-5 py-2.5 text-sm font-semibold rounded-t-lg border-b-2 border-primary text-primary">
            Pendientes <span id="count-pending" class="ml-1 bg-primary/10 text-primary text-xs px-1.5 py-0.5 rounded-full"></span>
        </button>
        <button id="tab-resolved" onclick="setTab('resolved')"
            class="px-5 py-2.5 text-sm font-semibold rounded-t-lg border-b-2 border-transparent text-outline hover:text-on-surface">
            Resueltas <span id="count-resolved" class="ml-1 bg-outline/10 text-outline text-xs px-1.5 py-0.5 rounded-full"></span>
        </button>
        <button id="tab-validated" onclick="setTab('validated')"
            class="px-5 py-2.5 text-sm font-semibold rounded-t-lg border-b-2 border-transparent text-outline hover:text-on-surface">
            Validadas <span id="count-validated" class="ml-1 bg-outline/10 text-outline text-xs px-1.5 py-0.5 rounded-full"></span>
        </button>
    </div>

    <div id="loading" class="text-center py-16 text-outline">Cargando…</div>
    <div id="empty" class="hidden text-center py-16 text-outline">
        <p class="text-2xl mb-2">✓</p>
        <p>No hay entradas en esta pestaña.</p>
    </div>

    <!-- Search panel (modal) -->
    <div id="search-panel" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 space-y-4">
            <div class="flex items-start justify-between">
                <div>
                    <h2 class="font-bold text-lg text-primary" id="panel-raw"></h2>
                    <p class="text-xs text-outline" id="panel-orig"></p>
                </div>
                <button onclick="closePanel()" class="text-outline hover:text-on-surface text-2xl leading-none">&times;</button>
            </div>

            <div class="flex gap-2">
                <input id="panel-query" type="text"
                    class="flex-1 border border-outline/30 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"
                    placeholder="Refinar búsqueda…"/>
                <button onclick="doSearch()"
                    class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm font-semibold hover:bg-primary/90">
                    Buscar
                </button>
            </div>

            <div id="candidates" class="space-y-2 max-h-52 overflow-y-auto"></div>

            <div id="preview-map" class="hidden"></div>

            <div id="selected-info" class="hidden bg-primary/10 rounded-lg p-3 text-sm space-y-1">
                <p class="font-bold text-primary" id="sel-name"></p>
                <p class="text-xs text-outline" id="sel-coords"></p>
            </div>

            <div class="flex justify-end gap-3">
                <button onclick="closePanel()" class="text-sm text-outline hover:text-on-surface px-4 py-2">Cancelar</button>
                <button id="btn-save" onclick="saveResolution()" disabled
                    class="bg-primary text-on-primary px-5 py-2 rounded-lg text-sm font-semibold disabled:opacity-40 hover:bg-primary/90">
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <!-- Pending table -->
    <table id="table-pending" class="hidden w-full text-sm border-collapse">
        <thead>
            <tr class="text-xs text-outline uppercase border-b border-outline/20">
                <th class="text-left py-3 px-2 w-8">#</th>
                <th class="text-left py-3 px-2">Lugar original</th>
                <th class="text-left py-3 px-2">Query normalizada</th>
                <th class="text-left py-3 px-2 w-20">Afecta</th>
                <th class="py-3 px-2 w-24"></th>
            </tr>
        </thead>
        <tbody id="tbody-pending"></tbody>
    </table>

    <!-- Validated table -->
    <table id="table-validated" class="hidden w-full text-sm border-collapse">
        <thead>
            <tr class="text-xs text-outline uppercase border-b border-outline/20">
                <th class="text-left py-3 px-2 w-8">#</th>
                <th class="text-left py-3 px-2">Lugar buscado</th>
                <th class="text-left py-3 px-2">Dirección GPS</th>
                <th class="text-left py-3 px-2 w-36">Coordenadas</th>
            </tr>
        </thead>
        <tbody id="tbody-validated"></tbody>
    </table>

    <!-- Resolved table -->
    <div id="resolved-toolbar" class="hidden flex items-center justify-between mb-3">
        <p class="text-xs text-outline">Columna "Dirección GPS" cargada desde Nominatim inverso.</p>
        <button onclick="fetchAllDisplayNames()"
            id="btn-fetch-all"
            class="text-xs border border-outline/40 text-outline px-3 py-1.5 rounded-lg hover:border-primary hover:text-primary font-semibold">
            Cargar nombres GPS faltantes
        </button>
    </div>
    <table id="table-resolved" class="hidden w-full text-sm border-collapse">
        <thead>
            <tr class="text-xs text-outline uppercase border-b border-outline/20">
                <th class="text-left py-3 px-2 w-8">#</th>
                <th class="text-left py-3 px-2">Lugar buscado</th>
                <th class="text-left py-3 px-2">Dirección GPS</th>
                <th class="text-left py-3 px-2 w-36">Coordenadas</th>
                <th class="py-3 px-2 w-24"></th>
            </tr>
        </thead>
        <tbody id="tbody-resolved"></tbody>
    </table>
</div>

<script>
let pending = [], resolved = [], validated = [];
let currentEntry = null;
let activeTab = 'pending';
let previewMap = null;
let previewMarker = null;
let selectedResult = null;

async function load() {
    const [rPending, rResolved, rValidated] = await Promise.all([
        fetch('/api/admin/geocoder/pending'),
        fetch('/api/admin/geocoder/resolved'),
        fetch('/api/admin/geocoder/validated'),
    ]);
    pending = await rPending.json();
    resolved = await rResolved.json();
    validated = await rValidated.json();

    document.getElementById('loading').classList.add('hidden');
    updateTabCounts();
    renderTable();
}

function updateTabCounts() {
    document.getElementById('count-pending').textContent = pending.length;
    document.getElementById('count-resolved').textContent = resolved.length;
    document.getElementById('count-validated').textContent = validated.length;
    document.getElementById('stats').textContent =
        `${pending.length} pendientes · ${resolved.length} resueltas · ${validated.length} validadas`;
}

function setTab(tab) {
    activeTab = tab;
    ['pending', 'resolved', 'validated'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
            btn.classList.add('border-primary', 'text-primary');
            btn.classList.remove('border-transparent', 'text-outline');
        } else {
            btn.classList.remove('border-primary', 'text-primary');
            btn.classList.add('border-transparent', 'text-outline');
        }
        const tbl = document.getElementById(`table-${t}`);
        if (tbl) tbl.classList.add('hidden');
    });
    const toolbar = document.getElementById('resolved-toolbar');
    if (toolbar) toolbar.classList.add('hidden');
    renderTable();
}

function renderTable() {
    document.getElementById('empty').classList.add('hidden');

    if (activeTab === 'pending') {
        if (!pending.length) { document.getElementById('empty').classList.remove('hidden'); return; }
        document.getElementById('tbody-pending').innerHTML = pending.map((e, i) => `
            <tr id="row-p-${i}" class="border-b border-outline/10 hover:bg-primary/5">
                <td class="py-3 px-2 text-outline text-xs">${i + 1}</td>
                <td class="py-3 px-2 font-medium max-w-xs truncate" title="${esc(e.raw_place)}">${esc(e.raw_place || '—')}</td>
                <td class="py-3 px-2 text-outline text-xs max-w-xs truncate" title="${esc(e.query)}">${esc(e.query)}</td>
                <td class="py-3 px-2 text-center">
                    ${e.affected > 0
                        ? `<span class="bg-primary/10 text-primary text-xs font-bold px-2 py-0.5 rounded-full">${e.affected}</span>`
                        : '<span class="text-outline text-xs">—</span>'}
                </td>
                <td class="py-3 px-2 text-right">
                    <button onclick="openPanel('pending', ${i})"
                        class="text-xs bg-primary text-on-primary px-3 py-1.5 rounded-lg hover:bg-primary/90 font-semibold">
                        Resolver
                    </button>
                </td>
            </tr>
        `).join('');
        document.getElementById('table-pending').classList.remove('hidden');

    } else if (activeTab === 'resolved') {
        if (!resolved.length) { document.getElementById('empty').classList.remove('hidden'); return; }
        document.getElementById('tbody-resolved').innerHTML = resolved.map((e, i) => `
            <tr id="row-r-${i}" class="border-b border-outline/10 hover:bg-primary/5">
                <td class="py-3 px-2 text-outline text-xs">${i + 1}</td>
                <td class="py-3 px-2 font-medium max-w-[200px] truncate" title="${esc(e.raw_place)}">${esc(e.raw_place || e.query || '—')}</td>
                <td class="py-3 px-2 text-xs max-w-xs" id="dn-${i}">
                    ${e.display_name
                        ? `<span class="${matchQuality(e.raw_place || e.query, e.display_name)}">${esc(e.display_name)}</span>`
                        : `<button onclick="fetchDisplayName(${i})" class="text-outline/50 hover:text-primary text-xs underline decoration-dotted">cargar</button>`}
                </td>
                <td class="py-3 px-2 text-xs text-outline font-mono whitespace-nowrap">${e.lat.toFixed(4)}, ${e.lng.toFixed(4)}</td>
                <td class="py-3 px-2 text-right">
                    <div class="flex gap-2 justify-end">
                        <button onclick="validateEntry(${i})" id="val-btn-${i}"
                            class="text-xs bg-green-700 text-white px-3 py-1.5 rounded-lg hover:bg-green-800 font-semibold">
                            Validar
                        </button>
                        <button onclick="openPanel('resolved', ${i})"
                            class="text-xs border border-primary text-primary px-3 py-1.5 rounded-lg hover:bg-primary/5 font-semibold">
                            Editar
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
        document.getElementById('table-resolved').classList.remove('hidden');
        document.getElementById('resolved-toolbar').classList.remove('hidden');

    } else if (activeTab === 'validated') {
        if (!validated.length) { document.getElementById('empty').classList.remove('hidden'); return; }
        document.getElementById('tbody-validated').innerHTML = validated.map((e, i) => `
            <tr class="border-b border-outline/10">
                <td class="py-3 px-2 text-outline text-xs">${i + 1}</td>
                <td class="py-3 px-2 font-medium max-w-[200px] truncate" title="${esc(e.raw_place)}">${esc(e.raw_place || e.query || '—')}</td>
                <td class="py-3 px-2 text-xs text-green-700">${esc(e.display_name || '—')}</td>
                <td class="py-3 px-2 text-xs text-outline font-mono whitespace-nowrap">${e.lat.toFixed(4)}, ${e.lng.toFixed(4)}</td>
            </tr>
        `).join('');
        document.getElementById('table-validated').classList.remove('hidden');
    }
}

function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shortDisplayName(dn) {
    // Show first 2 meaningful parts of Nominatim display_name (e.g. "Carrer de Tamarit, Eixample, Barcelona")
    if (!dn) return '';
    const parts = dn.split(',').map(p => p.trim()).filter(Boolean);
    return parts.slice(0, 3).join(', ');
}

function matchQuality(searched, found) {
    // Color hint: green if found name contains a word from searched, amber otherwise
    if (!searched || !found) return 'text-outline';
    const words = searched.toLowerCase().replace(/[,]/g,' ').split(/\s+/).filter(w => w.length > 3);
    const foundLc = found.toLowerCase();
    const ok = words.some(w => foundLc.includes(w));
    return ok ? 'text-green-700' : 'text-amber-600';
}

async function fetchDisplayName(idx) {
    const e = resolved[idx];
    const cell = document.getElementById(`dn-${idx}`);
    if (!cell) return;
    cell.innerHTML = '<span class="text-outline/40 text-xs">…</span>';
    try {
        const r = await fetch(`/api/admin/geocoder/reverse?lat=${e.lat}&lng=${e.lng}`);
        const data = await r.json();
        const dn = data.display_name || '';
        resolved[idx].display_name = dn;
        cell.innerHTML = dn
            ? `<span class="${matchQuality(e.raw_place || e.query, dn)}">${esc(dn)}</span>`
            : '<span class="text-outline/30 text-xs">—</span>';
    } catch {
        cell.innerHTML = '<span class="text-red-400 text-xs">error</span>';
    }
}

let _fetchAllRunning = false;
async function fetchAllDisplayNames() {
    if (_fetchAllRunning) return;
    _fetchAllRunning = true;
    const btn = document.getElementById('btn-fetch-all');
    const missing = resolved.map((e, i) => ({e, i})).filter(({e}) => !e.display_name);
    if (!missing.length) { btn.textContent = 'Todo cargado'; _fetchAllRunning = false; return; }
    btn.disabled = true;
    for (let k = 0; k < missing.length; k++) {
        btn.textContent = `Cargando ${k + 1}/${missing.length}…`;
        await fetchDisplayName(missing[k].i);
        if (k < missing.length - 1) await new Promise(r => setTimeout(r, 1200)); // Nominatim rate limit
    }
    btn.textContent = 'Cargado';
    btn.disabled = false;
    _fetchAllRunning = false;
}

function openPanel(source, idx) {
    currentEntry = source === 'pending' ? pending[idx] : resolved[idx];
    currentEntry._source = source;
    currentEntry._idx = idx;
    selectedResult = null;

    document.getElementById('panel-raw').textContent = currentEntry.raw_place || currentEntry.query;
    document.getElementById('panel-orig').textContent = `Query: ${currentEntry.query}`;
    document.getElementById('panel-query').value = currentEntry.query;
    document.getElementById('candidates').innerHTML = '';
    document.getElementById('selected-info').classList.add('hidden');
    document.getElementById('btn-save').disabled = true;

    const mapEl = document.getElementById('preview-map');
    mapEl.classList.add('hidden');
    if (previewMap) { previewMap.remove(); previewMap = null; previewMarker = null; }

    document.getElementById('search-panel').classList.remove('hidden');

    // For resolved entries, pre-show current coords on map
    if (source === 'resolved' && currentEntry.lat) {
        showOnMap(currentEntry.lat, currentEntry.lng, currentEntry.query);
    }
    doSearch();
}

function closePanel() {
    document.getElementById('search-panel').classList.add('hidden');
    if (previewMap) { previewMap.remove(); previewMap = null; }
}

async function doSearch() {
    const query = document.getElementById('panel-query').value.trim();
    if (!query) return;
    document.getElementById('candidates').innerHTML =
        '<p class="text-xs text-outline animate-pulse">Buscando…</p>';
    const res = await fetch('/api/admin/geocoder/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query})
    });
    const results = await res.json();

    if (!results.length) {
        document.getElementById('candidates').innerHTML =
            '<p class="text-xs text-outline">Sin resultados. Prueba otra búsqueda.</p>';
        return;
    }

    document.getElementById('candidates').innerHTML = results.map((r, i) => `
        <button onclick="selectCandidate(${i})"
            class="w-full text-left px-3 py-2 rounded-lg border border-outline/20 hover:border-primary hover:bg-primary/5 text-sm transition-colors"
            id="cand-${i}" data-lat="${r.lat}" data-lng="${r.lng}" data-name="${esc(r.display_name)}">
            <span class="font-medium">${esc(r.display_name)}</span>
            <span class="block text-xs text-outline">${r.lat.toFixed(5)}, ${r.lng.toFixed(5)} · ${esc(r.class)}/${esc(r.type)}</span>
        </button>
    `).join('');

    selectCandidate(0);
}

function selectCandidate(idx) {
    document.querySelectorAll('[id^="cand-"]').forEach(b =>
        b.classList.remove('border-primary', 'bg-primary/10')
    );
    const btn = document.getElementById(`cand-${idx}`);
    if (!btn) return;
    btn.classList.add('border-primary', 'bg-primary/10');

    const lat = parseFloat(btn.dataset.lat);
    const lng = parseFloat(btn.dataset.lng);
    const name = btn.dataset.name;
    selectedResult = {lat, lng, name};

    document.getElementById('sel-name').textContent = name;
    document.getElementById('sel-coords').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    document.getElementById('selected-info').classList.remove('hidden');
    document.getElementById('btn-save').disabled = false;

    showOnMap(lat, lng, name);
}

function showOnMap(lat, lng, label) {
    const mapEl = document.getElementById('preview-map');
    mapEl.classList.remove('hidden');
    if (!previewMap) {
        previewMap = L.map('preview-map', {scrollWheelZoom: false});
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap', maxZoom: 18
        }).addTo(previewMap);
    }
    previewMap.setView([lat, lng], 14);
    if (previewMarker) previewMarker.remove();
    previewMarker = L.marker([lat, lng]).bindPopup(label).addTo(previewMap);
    setTimeout(() => previewMap.invalidateSize(), 50);
}

async function validateEntry(idx) {
    const e = resolved[idx];
    const btn = document.getElementById(`val-btn-${idx}`);
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    await fetch('/api/admin/geocoder/validate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query: e.query})
    });
    validated.unshift({...e});
    resolved.splice(idx, 1);
    updateTabCounts();
    renderTable();
}

async function saveResolution() {
    if (!selectedResult || !currentEntry) return;
    document.getElementById('btn-save').disabled = true;
    document.getElementById('btn-save').textContent = 'Guardando…';

    await fetch('/api/admin/geocoder/resolve', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            query: currentEntry.query,
            lat: selectedResult.lat,
            lng: selectedResult.lng,
            display_name: selectedResult.name || '',
        })
    });
    closePanel();

    const src = currentEntry._source;
    const idx = currentEntry._idx;

    if (src === 'pending') {
        // Move from pending to resolved
        const entry = pending[idx];
        entry.lat = selectedResult.lat;
        entry.lng = selectedResult.lng;
        resolved.unshift({...entry});
        // Mark row visually
        const row = document.getElementById(`row-p-${idx}`);
        if (row) {
            row.classList.add('row-just-resolved');
            const btn = row.querySelector('button');
            btn.textContent = '✓ Resuelto';
            btn.disabled = true;
        }
    } else {
        // Update in-place in resolved list
        resolved[idx].lat = selectedResult.lat;
        resolved[idx].lng = selectedResult.lng;
        const row = document.getElementById(`row-r-${idx}`);
        if (row) {
            row.querySelector('td:nth-child(4)').textContent =
                `${selectedResult.lat.toFixed(4)}, ${selectedResult.lng.toFixed(4)}`;
        }
    }

    updateTabCounts();
    document.getElementById('btn-save').textContent = 'Guardar';
    document.getElementById('btn-save').disabled = false;
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
    if (e.key === 'Enter' && !document.getElementById('search-panel').classList.contains('hidden')) {
        if (document.activeElement?.id === 'panel-query') doSearch();
    }
});

load();
</script>
</body>
</html>
