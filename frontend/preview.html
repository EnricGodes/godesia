<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Godesia - Batch tester query_router</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      background: #f6f7f9;
      color: #1f2937;
    }
    .wrap {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 48px;
    }
    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
      padding: 18px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    .muted { color: #6b7280; }
    label { display:block; font-weight: 600; margin: 12px 0 6px; }
    input, textarea, select, button {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      padding: 10px 12px;
    }
    textarea { min-height: 220px; resize: vertical; }
    .row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      background: #111827;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: white;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 700;
      margin-right: 8px;
    }
    .ok { color: #065f46; }
    .warn { color: #92400e; }
    .err { color: #991b1b; }
    .result {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      background: #fff;
    }
    .q { font-weight: 700; margin-bottom: 8px; }
    .a {
      white-space: pre-wrap;
      background: #f9fafb;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #f0f2f5;
    }
    .meta {
      margin-top: 8px;
      font-size: 13px;
      color: #6b7280;
    }
    .small { font-size: 13px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Batch tester de Godesia</h1>
      <p class="muted">
        Este tester intenta detectar automáticamente el endpoint leyendo <code>app.js</code>.
        Si no lo consigue, puedes escribirlo manualmente.
      </p>
      <div id="detect-status" class="small muted">Detectando endpoint…</div>

      <div class="row">
        <div>
          <label for="endpoint">Endpoint</label>
          <input id="endpoint" value="" placeholder="/api/chat" />
        </div>
        <div>
          <label for="method">Método</label>
          <select id="method">
            <option value="POST" selected>POST</option>
            <option value="GET">GET</option>
          </select>
        </div>
        <div>
          <label for="delay">Pausa (ms)</label>
          <input id="delay" type="number" min="0" step="100" value="0" />
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="questionParam">Nombre del campo pregunta</label>
          <input id="questionParam" value="question" />
        </div>
        <div>
          <label for="extraParams">Campos extra JSON</label>
          <input id="extraParams" value='["message","text","query","prompt"]' />
        </div>
      </div>

      <label for="questions">Preguntas, una por línea</label>
      <textarea id="questions">¿Quién nació el 13/10/1834?
¿Qué personas nacieron en Morella?
¿Qué personas tienen Godes como primer apellido?
¿Qué parentesco había entre Emili Godes Hurtado y Rosa Godes Hurtado?</textarea>

      <div class="row2" style="margin-top:12px;">
        <button id="runBtn">Ejecutar pruebas</button>
        <button id="clearBtn" class="secondary" type="button">Limpiar resultados</button>
      </div>
    </div>

    <div class="card">
      <h2>Resultados</h2>
      <div id="summary" class="muted">Todavía no se ha lanzado ninguna prueba.</div>
      <div id="results"></div>
    </div>
  </div>

<script>
const endpointInput = document.getElementById('endpoint');
const methodInput = document.getElementById('method');
const delayInput = document.getElementById('delay');
const questionParamInput = document.getElementById('questionParam');
const extraParamsInput = document.getElementById('extraParams');
const questionsInput = document.getElementById('questions');
const runBtn = document.getElementById('runBtn');
const clearBtn = document.getElementById('clearBtn');
const detectStatus = document.getElementById('detect-status');
const summary = document.getElementById('summary');
const results = document.getElementById('results');

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function parseExtraParams() {
  try {
    const value = JSON.parse(extraParamsInput.value.trim() || "[]");
    return Array.isArray(value) ? value : [];
  } catch {
    return ["message","text","query","prompt"];
  }
}

function normalizeEndpoint(url) {
  if (!url) return "";
  const trimmed = String(url).trim().replace(/^['"`]|['"`]$/g, "");
  if (/^https?:\/\//i.test(trimmed)) return trimmed;
  if (trimmed.startsWith("/")) return trimmed;
  return "/" + trimmed.replace(/^\.?\//, "");
}

function extractFetchCandidates(js) {
  const candidates = new Set();

  // fetch('/api/chat')
  for (const m of js.matchAll(/fetch\s*\(\s*(['"`])([^'"`]+)\1/gi)) {
    candidates.add(m[2]);
  }

  // axios.post('/api/chat')
  for (const m of js.matchAll(/axios\.(?:post|get)\s*\(\s*(['"`])([^'"`]+)\1/gi)) {
    candidates.add(m[2]);
  }

  // const API_URL = '/api/chat'
  for (const m of js.matchAll(/\b(?:api|endpoint|url)[A-Z_\w]*\s*=\s*(['"`])([^'"`]+)\1/gi)) {
    candidates.add(m[2]);
  }

  // hard hints
  const commonHints = [
    "/api/chat", "/chat", "/ask", "/query", "/api/query", "/api/ask"
  ];
  for (const hint of commonHints) {
    if (js.includes(hint)) candidates.add(hint);
  }

  return [...candidates].map(normalizeEndpoint);
}

async function detectEndpointFromAppJs() {
  try {
    const res = await fetch("./app.js", { cache: "no-store" });
    if (!res.ok) throw new Error("No se pudo leer app.js");
    const js = await res.text();
    const candidates = extractFetchCandidates(js)
      .filter(Boolean)
      .filter(x => !/\.html?$|\.css$|\.png$|\.jpg$|\.svg$/i.test(x));

    if (candidates.length) {
      endpointInput.value = candidates[0];
      detectStatus.innerHTML =
        '<span class="pill">Detectado</span> Posibles endpoints en <code>app.js</code>: ' +
        candidates.map(x => `<code>${x}</code>`).join(", ");
      return;
    }

    detectStatus.innerHTML =
      '<span class="pill">Sin detectar</span> He podido leer <code>app.js</code>, pero no he encontrado una ruta clara. Escribe el endpoint manualmente.';
  } catch (err) {
    detectStatus.innerHTML =
      '<span class="pill">Sin detectar</span> No he podido leer <code>app.js</code> desde este HTML. Súbelo junto a este fichero o indica el endpoint manualmente.';
  }
}

function extractAnswer(data) {
  if (data == null) return "(respuesta vacía)";
  if (typeof data === "string") return data;

  const candidates = [
    data.answer,
    data.response,
    data.message,
    data.text,
    data.result,
    data.reply
  ];

  for (const c of candidates) {
    if (typeof c === "string" && c.trim()) return c;
  }

  try {
    return JSON.stringify(data, null, 2);
  } catch {
    return String(data);
  }
}

async function askQuestion(question) {
  const endpoint = endpointInput.value.trim();
  const method = methodInput.value;
  const qKey = questionParamInput.value.trim() || "question";
  const extraKeys = parseExtraParams();

  if (!endpoint) throw new Error("Falta el endpoint");

  if (method === "GET") {
    const url = new URL(endpoint, window.location.origin);
    url.searchParams.set(qKey, question);
    const res = await fetch(url.toString(), { method: "GET" });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    return { status: res.status, data };
  } else {
    const payload = { [qKey]: question };
    for (const k of extraKeys) {
      if (k && !payload[k]) payload[k] = question;
    }

    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }
    return { status: res.status, data };
  }
}

function addResultCard(index, question, answer, status, raw) {
  const div = document.createElement("div");
  div.className = "result";
  div.innerHTML = `
    <div class="q">${index}. ${escapeHtml(question)}</div>
    <div class="a">${escapeHtml(answer)}</div>
    <div class="meta">HTTP ${status}</div>
    <details class="meta">
      <summary>Respuesta cruda</summary>
      <pre class="a" style="margin-top:8px;">${escapeHtml(typeof raw === 'string' ? raw : JSON.stringify(raw, null, 2))}</pre>
    </details>
  `;
  results.appendChild(div);
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

runBtn.addEventListener('click', async () => {
  const questions = questionsInput.value
    .split(/\r?\n/)
    .map(x => x.trim())
    .filter(Boolean);

  results.innerHTML = "";
  if (!questions.length) {
    summary.textContent = "No hay preguntas.";
    return;
  }

  runBtn.disabled = true;
  const delay = Number(delayInput.value || 0);
  let ok = 0, fail = 0;

  summary.textContent = `Ejecutando ${questions.length} preguntas…`;

  for (let i = 0; i < questions.length; i++) {
    const q = questions[i];
    try {
      const { status, data } = await askQuestion(q);
      const answer = extractAnswer(data);
      addResultCard(i + 1, q, answer, status, data);
      if (status >= 200 && status < 300) ok++;
      else fail++;
    } catch (err) {
      addResultCard(i + 1, q, `ERROR: ${err.message}`, 0, String(err));
      fail++;
    }
    if (delay > 0 && i < questions.length - 1) {
      await sleep(delay);
    }
  }

  summary.innerHTML = `Terminadas ${questions.length} preguntas. <span class="ok">OK: ${ok}</span> · <span class="err">Errores: ${fail}</span>`;
  runBtn.disabled = false;
});

clearBtn.addEventListener('click', () => {
  results.innerHTML = "";
  summary.textContent = "Resultados limpiados.";
});

detectEndpointFromAppJs();
</script>
</body>
</html>
