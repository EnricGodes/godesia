<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godesia - Arbre Genealògic</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tree-app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tree-controls {
            padding: 12px 20px;
            background: #16162a;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        #tree-search {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #3a3a5a;
            border-radius: 6px;
            background: #2a2a4a;
            color: #e0e0e0;
            font-size: 0.9rem;
            outline: none;
        }

        #tree-search:focus {
            border-color: #c9a96e;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 0 0 6px 6px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a2e;
            font-size: 0.85rem;
        }

        .search-result-item:hover {
            background: #3a3a5a;
        }

        .search-result-item .years {
            color: #888;
            font-size: 0.75rem;
        }

        .tree-container {
            flex: 1;
            overflow: hidden;
            background: #12122a;
        }

        .tree-container svg {
            width: 100%;
            height: 100%;
        }

        /* Tree nodes */
        .node rect {
            fill: #2a2a4a;
            stroke: #c9a96e;
            stroke-width: 1.5;
            rx: 6;
        }

        .node.root rect {
            stroke-width: 2.5;
            fill: #3a2a1a;
        }

        .node text {
            fill: #e0e0e0;
            font-size: 11px;
        }

        .node .years-text {
            fill: #888;
            font-size: 9px;
        }

        .node image {
            clip-path: circle(14px);
        }

        .link {
            fill: none;
            stroke: #4a4a6a;
            stroke-width: 1.5;
        }

        .spouse-link {
            stroke: #c9a96e;
            stroke-dasharray: 4 2;
        }

        .tree-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #555;
            font-size: 0.75rem;
        }

        .zoom-controls {
            display: flex;
            gap: 4px;
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            background: #2a2a4a;
            border: 1px solid #3a3a5a;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:hover {
            background: #3a3a5a;
        }
    </style>
</head>
<body>
    <div class="tree-app">
        <header>
            <h1>Godesia</h1>
            <nav>
                <a href="/" class="nav-link">Chat</a>
                <a href="/tree.html" class="nav-link active">Arbre</a>
            </nav>
        </header>

        <div class="tree-controls">
            <div class="search-wrapper">
                <input type="text" id="tree-search" placeholder="Cerca una persona..." autocomplete="off">
                <div class="search-results" id="search-results"></div>
            </div>
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomIn()">+</button>
                <button class="zoom-btn" onclick="zoomOut()">-</button>
                <button class="zoom-btn" onclick="resetZoom()">R</button>
            </div>
        </div>

        <div class="tree-container" id="tree-container">
            <svg id="tree-svg"></svg>
            <div class="tree-info" id="tree-info">Cerca una persona per veure el seu arbre</div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="tree.js"></script>
</body>
</html>
