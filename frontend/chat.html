<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godesia - Árbol Genealógico Godes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={corePlugins:{preflight:false}}</script>
</head>
<body>
    <div class="app">

        <div class="chat-container" id="chat">
            <div class="message assistant">
                <div class="message-content">
                    <p>Hola! Soy Godesia, tu asistente genealógico de la familia Godes.</p>
                    <p class="hint">Consultas directas (gratis): "madre/padre/hijos de...", "cuando nació...", "busca...", "estadísticas"</p>
                    <p class="hint">Consultas complejas (IA, con coste): te pediré confirmación antes de usar la API.</p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <form id="query-form">
                <input type="text" id="question" placeholder="Escribe tu pregunta sobre la familia Godes..." autocomplete="off" autofocus>
                <button type="submit" id="send-btn">Enviar</button>
            </form>
        </div>
    </div>

    <!-- Person panel (fixed sidebar) -->
    <div id="person-panel">
        <button id="person-panel-close" onclick="closePersonPanel()" title="Cerrar">×</button>
        <div id="person-panel-content"></div>
    </div>

    <script src="mention-autocomplete.js"></script>
    <script src="app.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
