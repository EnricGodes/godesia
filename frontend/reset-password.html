<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godesia</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            'primary': '#17341e', 'primary-container': '#2d4b33', 'on-primary': '#ffffff',
            'surface': '#fbf9f2', 'on-surface': '#1c1c17', 'outline': '#7c7a6e',
            'outline-variant': '#cdcabb',
        }, fontFamily: { sans: ['Manrope', 'sans-serif'], serif: ['Noto Serif', 'serif'] } } } };
    </script>
    <style>
        body { background: #fbf9f2; font-family: 'Manrope', sans-serif; color: #1c1c17; }
        .lg-input { border: 1px solid #cdcabb; border-radius: 0.6rem; padding: 0.65rem 0.85rem; width: 100%; font-size: 0.95rem; background: #fff; }
        .lg-input:focus { outline: none; border-color: #2d4b33; box-shadow: 0 0 0 3px rgba(45,75,51,0.12); }
        .lg-btn { background: #17341e; color: #fff; border-radius: 0.6rem; padding: 0.7rem; width: 100%; font-weight: 700; font-size: 0.95rem; transition: opacity .15s; }
        .lg-btn:hover { opacity: 0.9; } .lg-btn:disabled { opacity: 0.55; cursor: default; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center mb-6">
            <div class="w-14 h-14 rounded-xl bg-primary-container flex items-center justify-center mb-3">
                <span class="material-symbols-outlined text-on-primary text-[1.8rem]">lock_reset</span>
            </div>
            <h1 class="font-serif text-2xl text-primary italic">Godesia</h1>
            <p class="text-sm text-outline mt-1 text-center" data-i18n="pages.reset.subtitle">Elige una nueva contraseña</p>
        </div>

        <div class="bg-white rounded-2xl border border-outline-variant/40 shadow-sm p-6">
            <!-- RESET FORM -->
            <form id="form-reset" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-outline mb-1 uppercase tracking-wide" data-i18n="pages.reset.password">Nueva contraseña</label>
                    <input type="password" name="password" class="lg-input" required minlength="6" autocomplete="new-password">
                </div>
                <div>
                    <label class="block text-xs font-bold text-outline mb-1 uppercase tracking-wide" data-i18n="pages.reset.password_confirm">Repite la contraseña</label>
                    <input type="password" name="password2" class="lg-input" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="lg-btn" data-i18n="pages.reset.submit">Guardar contraseña</button>
            </form>

            <!-- OK / DONE -->
            <div id="rs-done" class="hidden text-center space-y-4">
                <p class="text-sm text-primary" data-i18n="pages.reset.ok">Tu contraseña se ha actualizado.</p>
                <a href="/login.html" class="lg-btn inline-block" data-i18n="pages.reset.go_login">Entrar</a>
            </div>

            <!-- INVALID TOKEN -->
            <div id="rs-invalid" class="hidden text-center space-y-4">
                <p class="text-sm text-red-700" data-i18n="pages.reset.err_token">El enlace no es válido o ha caducado.</p>
                <a href="/login.html" class="lg-btn inline-block" data-i18n="pages.reset.go_login">Entrar</a>
            </div>

            <div id="rs-msg" class="hidden mt-4 text-sm rounded-lg px-3 py-2"></div>
        </div>
    </div>

    <script>
        const T = (k, fb) => (window.t ? window.t(k, null, fb) : fb);
        const params = new URLSearchParams(location.search);
        const token = params.get('token') || '';
        const formReset = document.getElementById('form-reset');
        const done = document.getElementById('rs-done');
        const invalid = document.getElementById('rs-invalid');
        const msg = document.getElementById('rs-msg');

        function showMsg(text) {
            msg.textContent = text;
            msg.className = 'mt-4 text-sm rounded-lg px-3 py-2 bg-red-50 text-red-700';
        }

        async function post(url, body) {
            const res = await fetch(url, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body), credentials: 'same-origin'
            });
            let data = {};
            try { data = await res.json(); } catch (e) {}
            return { ok: res.ok, status: res.status, data };
        }

        // Comprueba el token al cargar; si no vale, muestra el aviso.
        (async () => {
            if (!token) { formReset.classList.add('hidden'); invalid.classList.remove('hidden'); return; }
            try {
                const res = await fetch('/api/auth/reset-valid?token=' + encodeURIComponent(token));
                const d = await res.json();
                if (!d.valid) { formReset.classList.add('hidden'); invalid.classList.remove('hidden'); }
            } catch (e) { /* dejamos el form; el submit revalida */ }
        })();

        formReset.addEventListener('submit', async e => {
            e.preventDefault();
            const f = new FormData(formReset);
            const p1 = f.get('password'), p2 = f.get('password2');
            if (p1 !== p2) { showMsg(T('pages.reset.err_mismatch', 'Las contraseñas no coinciden.')); return; }
            const btn = formReset.querySelector('button'); btn.disabled = true;
            const r = await post('/api/auth/reset-password', { token, password: p1 });
            btn.disabled = false;
            if (r.ok) {
                formReset.classList.add('hidden'); msg.classList.add('hidden');
                done.classList.remove('hidden');
            } else if (r.status === 400) {
                formReset.classList.add('hidden'); invalid.classList.remove('hidden');
            } else {
                showMsg((r.data && r.data.detail) || T('pages.reset.err_generic', 'No se pudo cambiar la contraseña.'));
            }
        });
    </script>
</body>
</html>
